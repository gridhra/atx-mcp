[package]
# crates.io 公開名(命名の理由は Cargo.toml の workspace.dependencies のコメント参照)。
# `[lib] name` は `atx_geometry` のまま。
name = "asset-transform-geometry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["multimedia::images"]
readme = "README.md"
description = "Geometry detection for deterministic image transforms: scan tilt (Hough) and document quadrilateral detection. Part of the atx-mcp MCP server."

[lib]
name = "atx_geometry"
path = "src/lib.rs"

[dependencies]
image.workspace = true
imageproc.workspace = true
serde.workspace = true
schemars.workspace = true
thiserror.workspace = true

[dev-dependencies]
image.workspace = true
imageproc.workspace = true
serde_json.workspace = true
proptest = "1"
