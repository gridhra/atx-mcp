[package]
name = "atx-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Deterministic (non-generative) asset transformation MCP server: immutable, content-addressed image transforms for AI agents."

[lib]
name = "atx_mcp"
path = "src/lib.rs"

[[bin]]
name = "atx-mcp"
path = "src/main.rs"

[dependencies]
atx-core.workspace = true
atx-geometry.workspace = true
atx-store.workspace = true
image.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
