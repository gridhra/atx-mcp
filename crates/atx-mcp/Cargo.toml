[package]
name = "atx-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Deterministic (non-generative) asset transformation MCP server: immutable, content-addressed image transforms for AI agents."

[lib]
name = "atx_mcp"
path = "src/lib.rs"

# `cargo binstall atx-mcp` が GitHub Release のビルド済みバイナリを取れるようにする
# (ソースからのビルドを回避)。書式は release.yml が実際に作る成果物名に合わせてある:
#   アーカイブ  atx-mcp-<version>-<target>.tar.gz(Windows は .zip)
#   中身        atx-mcp-<version>-<target>/atx-mcp(Windows は atx-mcp.exe)
# target は release.yml の matrix の 5 つ(aarch64-apple-darwin / x86_64-apple-darwin /
# x86_64-unknown-linux-musl / aarch64-unknown-linux-musl / x86_64-pc-windows-msvc)。
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/atx-mcp-{ version }-{ target }{ archive-suffix }"
bin-dir = "atx-mcp-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "atx-mcp"
path = "src/main.rs"

[dependencies]
atx-core.workspace = true
atx-geometry.workspace = true
atx-store.workspace = true
image.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
