[package]
# crates.io 公開名。`atx-core` は無関係の別プロジェクトが先に取得済みのため使えない。
# `[lib] name` は `atx_core` のままなので、利用者は `asset-transform-core = "0.6.2"` と書いて
# コードでは `use atx_core::…` と書く。
name = "asset-transform-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["multimedia::images"]
readme = "README.md"
description = "Deterministic, non-generative image transform engine: pure recipe DSL (crop, resize, rotate, tone, LUT, mask, layers) with byte-identical output. Core of the atx-mcp MCP server."

[lib]
name = "atx_core"
path = "src/lib.rs"

[dependencies]
image.workspace = true
imageproc.workspace = true
fast_image_resize.workspace = true
kamadak-exif.workspace = true
jpeg-encoder.workspace = true
webp.workspace = true
ravif.workspace = true
resvg.workspace = true
skrifa.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
image.workspace = true
proptest = "1"
# gen_fixture example のみ: 生成した tilted_scene.jpg を detect_tilt で自己検証するため。
# atx-core 本体は atx-geometry に依存しない(依存方向は変えない、examples/dev-deps 限定)。
atx-geometry.workspace = true
