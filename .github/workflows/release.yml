name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            npm_platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            npm_platform: darwin-x64
            need_nasm: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            npm_platform: linux-x64
            need_nasm: true
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            npm_platform: linux-arm64
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm_platform: win32-x64
            need_nasm: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # ravif -> rav1e assembles its x86_64 SIMD kernels with nasm. aarch64 uses
      # gas through the `cc` crate and needs nothing extra.
      - name: Install nasm (Linux)
        if: matrix.need_nasm && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install nasm (macOS)
        if: matrix.need_nasm && runner.os == 'macOS'
        run: brew install nasm
      - name: Install nasm (Windows)
        if: matrix.need_nasm && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # musl-tools provides musl-gcc, which the `cc` crate auto-selects for
      # *-linux-musl targets (needed by libwebp-sys' vendored C sources).
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --bin atx-mcp --target ${{ matrix.target }}

      - name: Stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          NAME="atx-mcp-${VERSION}-${{ matrix.target }}"
          echo "ARCHIVE_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p "staging/$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/atx-mcp.exe" "staging/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/atx-mcp" "staging/$NAME/"
          fi
          cp LICENSE README.md "staging/$NAME/"

      - name: Create archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C staging -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Create archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "staging/$env:ARCHIVE_NAME" -DestinationPath "$env:ARCHIVE_NAME.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}.tar.gz
            ${{ env.ARCHIVE_NAME }}.zip
          if-no-files-found: error

      # Raw binary, consumed by the npm packaging job.
      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: npmbin-${{ matrix.npm_platform }}
          path: staging/${{ env.ARCHIVE_NAME }}/atx-mcp*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

  npm:
    name: publish npm packages
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - uses: actions/download-artifact@v4
        with:
          pattern: npmbin-*
          path: npmbins

      - name: Assemble npm packages
        run: node npm/scripts/build-packages.mjs --version "${{ needs.release.outputs.version }}" --bins npmbins

      # Auth: npm trusted publishing via GitHub OIDC — no token, no secret.
      # Each package must have this repo + workflow registered as its
      # Trusted Publisher on npmjs.com (see RELEASING.md). A package without
      # that registration fails here; first-time packages are published
      # manually via scripts/publish-npm-local.sh.
      - name: Publish
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # Idempotency guard: a re-run after a partial failure (e.g. the win32
          # spam-block below) must not re-attempt packages that already made it
          # to the registry. `npm publish` on an existing version 403s and would
          # otherwise fail the whole re-run.
          already_published() {
            local pkg_dir="$1"
            local name
            name="$(node -p "require('./$pkg_dir/package.json').name")"
            npm view "$name@$VERSION" version >/dev/null 2>&1
          }
          # Platform packages first: the main package's optionalDependencies
          # pin these exact versions.
          for pkg in npm/dist/atx-mcp-*; do
            echo "==> publishing $pkg"
            if already_published "$pkg"; then
              echo "$(node -p "require('./$pkg/package.json').name")@$VERSION already published, skipping"
              continue
            fi
            # win32 パッケージは npm のスパム誤検知の解除待ち(サポート対応中)のため、
            # 失敗してもリリース全体は止めない。ランチャーの optionalDependencies は
            # 存在しないバージョンを参照しても npm が optional として警告スキップする。
            if [ "$(basename "$pkg")" = "atx-mcp-win32-x64" ]; then
              npm publish --provenance --access public "$pkg" \
                || echo "::warning::atx-mcp-win32-x64 publish failed (npm spam-block pending); continuing"
            else
              npm publish --provenance --access public "$pkg"
            fi
          done
          echo "==> publishing npm/dist/atx-mcp"
          if already_published npm/dist/atx-mcp; then
            echo "$(node -p "require('./npm/dist/atx-mcp/package.json').name")@$VERSION already published, skipping"
          else
            npm publish --provenance --access public npm/dist/atx-mcp
          fi
